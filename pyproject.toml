[project]
name = "chord-unilab"
version = "0.1.0"
description = "Faithful reproduction of CHORD dexterous-hand + FlashSAC reference tracking on UniLab/Newton"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dependencies = [
    "unilab[newton]==1.5.3",
    "unisim-core[newton]==2.2.4",
    # ChordReferenceLoader: direct parquet read (pyarrow) and SLERP resampling
    # (scipy), mirroring flash_chord's loader dependencies.
    "pyarrow",
    "scipy",
    # Object collision CoACD and the mesh loader use the GT implementation and version.
    "coacd==1.0.11",
    "trimesh",
    "hydra-core>=1.3.2,<1.4",
    "viser>=1.0.26",
    "usd-core==26.5",
    "warp-lang==1.16.0",
    # CHORD-owned FlashSAC runtime and training lifecycle.
    "numpy",
    "torch>=2.9,<2.15",
    "gymnasium",
    "omegaconf",
    "rich",
    "tensorboard>=2.21.0",
    "wandb>=0.22.3",
    "onnx",
    "onnxscript",
    "onnxruntime<1.20 ; python_version < '3.11'",
    "onnxruntime>=1.20 ; python_version >= '3.11'",
    "setuptools",
    "ninja ; sys_platform == 'linux'",
]

[project.scripts]
uni-cumps = "chord_unilab.training.cuda_mps_cli:main"

[project.entry-points."unilab.tasks"]
chord_unilab = "chord_unilab.tasks"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pyright>=1.1.408", "scipy-stubs"]

[[tool.uv.index]]
name = "r2-cu130"
url = "https://download-r2.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# cu130 carries torch>=2.12 CUDA wheels for linux/win; macOS resolves from PyPI.
torch = [
    { index = "r2-cu130", marker = "sys_platform=='linux' or sys_platform=='win32'" },
]

[tool.uv]
# UniLab still pins an older UniSim; CHORD requires the public API released in
# UniSim 2.2.4. Remove this override when UniLab updates its dependency pin.
override-dependencies = ["unisim-core==2.2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chord_unilab", "src/hydra_plugins"]
artifacts = ["src/chord_unilab/rl/runtime/ipc/replay_pipelines/native_h2d_ext.cpp"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N806", "E402", "F401", "N801", "F821", "E741", "N802", "N803", "N812"]

[[tool.mypy.overrides]]
# These dependencies ship no type stubs / py.typed marker.
module = [
    "mujoco",
    "mujoco.*",
    "pyarrow",
    "pyarrow.*",
    "coacd",
    "coacd.*",
    "trimesh",
    "trimesh.*",
    "warp",
    "warp.*",
    "unisim",
    "unisim.*",
    "unilab",
    "unilab.*",
    "onnxruntime",
    "tensorboard",
    "tensorboard.*",
    "rsl_rl",
    "rsl_rl.*",
    "psutil",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "newton: real Newton integration tests using repository LFS data",
    "slow: long-running runtime or distributed integration tests",
]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src/chord_unilab", "tests"]
exclude = [
    "src/chord_unilab/assets/",  # direct mujoco C bindings; no usable stubs (same convention as UniLab's envs/visualization excludes)
    # UniLab's pyright gate covers src only; keep the same scope for migrated tests.
    "tests/rl/",
    "tests/training/",
]
reportMissingImports = "warning"
reportMissingModuleSource = "none"
